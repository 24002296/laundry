<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LaundryConnect - Payment</title>

    <link rel="stylesheet"
          href="subscription-payment.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="payment-page">


    <!-- HEADER -->

    <header class="payment-header">

        <div class="logo">

            🧺 LaundryConnect

        </div>


        <button
            onclick="logout()"
            class="logout-btn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </header>



    <!-- PAYMENT CARD -->

    <main class="payment-container">


        <div class="payment-card">


            <div class="payment-icon">

                <i class="fa-solid fa-credit-card"></i>

            </div>


            <h1>
                Complete Your Subscription
            </h1>


            <p class="subtitle">

                Activate your LaundryConnect
                laundromat account.

            </p>



            <!-- SUMMARY -->

            <div class="summary">


                <div>

                    <span>
                        Account
                    </span>

                    <strong>
                        Laundromat
                    </strong>

                </div>


                <div>

                    <span>
                        Plan
                    </span>

                    <strong id="plan">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Amount
                    </span>

                    <strong id="amount">
                        R0
                    </strong>

                </div>


                <div>

                    <span>
                        Billing
                    </span>

                    <strong>
                        Monthly
                    </strong>

                </div>

            </div>



            <!-- PAYMENT FORM -->

            <form id="paymentForm">


                <label for="paymentMethod">

                    Payment Method

                </label>


                <select
                    id="paymentMethod"
                    required>


                    <option value="card">

                        Credit / Debit Card

                    </option>


                    <option value="eft">

                        EFT

                    </option>


                    <option value="wallet">

                        Digital Wallet

                    </option>


                </select>



                <!-- CARD DETAILS -->

                <div id="cardDetails">


                    <label>

                        Card Number

                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        placeholder="1234 5678 9012 3456"
                        maxlength="19">


                    <div class="card-row">


                        <div>

                            <label>

                                Expiry Date

                            </label>

                            <input
                                type="text"
                                placeholder="MM/YY"
                                maxlength="5">

                        </div>


                        <div>

                            <label>

                                CVV

                            </label>

                            <input
                                type="password"
                                placeholder="***"
                                maxlength="4">

                        </div>

                    </div>

                </div>



                <button
                    type="submit"
                    class="pay-btn">

                    <i class="fa-solid fa-lock"></i>

                    Pay & Activate Subscription

                </button>


            </form>



            <p class="secure">

                🔒 Your payment information is securely processed.

            </p>


            <button
                class="back-btn"
                onclick="goBack()">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Plans

            </button>


        </div>

    </main>

</div>



<script>


const API =
    "https://laundry-ktbs.onrender.com";


/*
========================================================
GET LOGGED-IN USER
========================================================
*/

const user =
    JSON.parse(
        localStorage.getItem("loggedInUser")
    );


/*
========================================================
CHECK USER
========================================================
*/

if (!user) {

    alert("Please login first.");

    window.location.href =
        "../login.html";

}


/*
========================================================
CHECK ROLE
========================================================
*/

if (
    user &&
    user.role !== "laundromat"
) {

    alert(
        "This payment page is only for laundromats."
    );

    window.location.href =
        "../login.html";

}


/*
========================================================
GET SELECTED PLAN
========================================================
*/

const plan =
    localStorage.getItem(
        "laundromatPlan"
    );


const amount =
    localStorage.getItem(
        "laundromatSubscriptionAmount"
    );


/*
========================================================
DISPLAY PLAN
========================================================
*/

if (!plan || !amount) {

    alert(
        "Please select a subscription plan."
    );

    window.location.href =
        "subscription.html";

}


document.getElementById(
    "plan"
).textContent = plan;


document.getElementById(
    "amount"
).textContent =
    "R" +
    Number(amount).toFixed(2);



/*
========================================================
PAYMENT METHOD
========================================================
*/

const paymentMethod =
    document.getElementById(
        "paymentMethod"
    );


paymentMethod.addEventListener(
    "change",
    function () {

        const cardDetails =
            document.getElementById(
                "cardDetails"
            );


        if (this.value === "card") {

            cardDetails.style.display =
                "block";

        }

        else {

            cardDetails.style.display =
                "none";

        }

    }
);



/*
========================================================
SUBMIT PAYMENT
========================================================
*/

document.getElementById(
    "paymentForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!user) {

            alert(
                "Please login first."
            );

            return;

        }


        const method =
            document.getElementById(
                "paymentMethod"
            ).value;


        const payButton =
            document.querySelector(
                ".pay-btn"
            );


        payButton.disabled = true;

        payButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';



        try {


            const response =
                await fetch(
                    API + "/subscriptions",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            user_id:
                                user.id,

                            role:
                                "laundromat",

                            plan:
                                plan,

                            amount:
                                Number(amount),

                            payment_method:
                                method

                        })

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Payment failed."
                );

            }


            /*
            ============================================
            PAYMENT SUCCESS
            ============================================
            */

            alert(
                "Subscription activated successfully!"
            );


            /*
            Remove temporary plan data.
            */

            localStorage.removeItem(
                "laundromatPlan"
            );


            localStorage.removeItem(
                "laundromatSubscriptionAmount"
            );


            /*
            Send laundromat to dashboard.
            */

            window.location.href =
                "dashboard.html";


        }

        catch(error) {

            console.error(
                "SUBSCRIPTION PAYMENT ERROR:",
                error
            );


            alert(
                error.message ||
                "Unable to process subscription."
            );


            payButton.disabled =
                false;


            payButton.innerHTML =
                '<i class="fa-solid fa-lock"></i> Pay & Activate Subscription';

        }

    }
);



/*
========================================================
BACK TO PLANS
========================================================
*/

function goBack() {

    window.location.href =
        "subscription.html";

}



/*
========================================================
LOGOUT
========================================================
*/

function logout() {

    localStorage.removeItem(
        "loggedInUser"
    );


    localStorage.removeItem(
        "laundromatPlan"
    );


    localStorage.removeItem(
        "laundromatSubscriptionAmount"
    );


    window.location.href =
        "../login.html";

}

</script>

</body>

</html>
