<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile | Campus Laundry Connect</title>

    <link rel="stylesheet" href="profile.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<script>

// CHECK LOGIN

const user = JSON.parse(
    localStorage.getItem("loggedInUser")
);

let laundromatId = null;
if(!user || user.role !== "laundromat"){

    alert("Please login first.");

    window.location.href="../login.html";

}

</script>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🧺 LaundryConnect</h2>

        <p class="business" id="businessName">
            Loading...
        </p>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="services.html">
                    <i class="fa-solid fa-soap"></i>
                    Services
                </a>
            </li>

            <li>
                <a href="machines.html">
                    <i class="fa-solid fa-gears"></i>
                    Machines
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    Business Profile
                </a>

            <li>

                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <h1>Business Profile</h1>

<section class="profile-card">

    <!-- PROFILE HEADER -->
    <div class="profile-header">

        <div class="profile-picture-section">

            <img
                id="logoPreview"
                class="profile-picture"
                src="https://laundry-ktbs.onrender.com/uploads/laundromats/default-laundry.png"
                alt="Business Logo"
            >

            <input
                type="file"
                id="logoInput"
                accept="image/png,image/jpeg,image/jpg,image/webp"
                hidden
            >

            <button
                type="button"
                class="change-picture-btn"
                id="chooseLogoBtn">

                <i class="fa-solid fa-camera"></i>

                Change Business Logo

            </button>

            <p id="logoMessage"></p>

        </div>


        <div class="profile-name">

            <h2 id="profileBusinessName">
                Loading...
            </h2>

            <p>
                Laundromat Business
            </p>

        </div>

    </div>


    <!-- BUSINESS INFORMATION -->
    <div class="personal-information">

        <div class="section-title">

            <i class="fa-solid fa-store"></i>

            <h2>Business Information</h2>

        </div>


        <form id="profileForm">

            <div class="form-grid">

                <div class="input-box">

                    <label>
                        Business Name
                    </label>

                    <input
                        type="text"
                        id="businessNameInput"
                        required>

                </div>


                <div class="input-box">

                    <label>
                        Owner Name
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        required>

                </div>


                <div class="input-box">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>


                <div class="input-box">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        required>

                </div>


                <div class="input-box">

                    <label>
                        Opening Time
                    </label>

                    <input
                        type="time"
                        id="openingTime">

                </div>


                <div class="input-box">

                    <label>
                        Closing Time
                    </label>

                    <input
                        type="time"
                        id="closingTime">

                </div>


                <div class="input-box">

                    <label>
                        Pickup Service
                    </label>

                    <select id="pickupService">

                        <option value="Enabled">
                            Enabled
                        </option>

                        <option value="Disabled">
                            Disabled
                        </option>

                    </select>

                </div>


                <div class="input-box">

                    <label>
                        Delivery Service
                    </label>

                    <select id="deliveryService">

                        <option value="Enabled">
                            Enabled
                        </option>

                        <option value="Disabled">
                            Disabled
                        </option>

                    </select>

                </div>

            </div>


            <div class="input-box instructions-box">

                <label>
                    Business Address
                </label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your business address">
                </textarea>

            </div>


            <div class="save-container">

                <button
                    class="save-btn"
                    type="submit">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</section>
        <section class="card">

            <h2>Change Password</h2>

            <form id="passwordForm">

                <label>Current Password</label>

                <input
                    type="password"
                    id="currentPassword"
                    required>

                <label>New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    required>

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    required>

                <button class="password-btn" type="submit">

                    <i class="fa-solid fa-lock"></i>

                    Update Password

                </button>

            </form>

        </section>

    </main>

</div>

<script>

const API_URL = "https://laundry-ktbs.onrender.com";

let loggedInUser = JSON.parse(
    localStorage.getItem("loggedInUser")
);


// ==========================================
// CHECK LOGIN
// ==========================================

if (!loggedInUser || loggedInUser.role !== "laundromat") {

    alert("Please login first.");

    window.location.href = "../login.html";

}


// =====================================================
// CHOOSE LOGO
// =====================================================

document
    .getElementById("chooseLogoBtn")
    .addEventListener("click", function () {

        document
            .getElementById("logoInput")
            .click();

    });


// =====================================================
// PREVIEW LOGO BEFORE UPLOAD
// =====================================================

document
    .getElementById("logoInput")
    .addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            document
                .getElementById("logoPreview")
                .src = event.target.result;

        };

        reader.readAsDataURL(file);

        uploadLogo(file);

    });


// =====================================================
// CHOOSE BUSINESS LOGO
// =====================================================

const chooseLogoBtn = document.getElementById("chooseLogoBtn");
const logoInput = document.getElementById("logoInput");
const logoPreview = document.getElementById("logoPreview");
const logoMessage = document.getElementById("logoMessage");


// Open file selector
chooseLogoBtn.addEventListener("click", function () {

    logoInput.click();

});


// =====================================================
// PREVIEW + UPLOAD LOGO
// =====================================================

logoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    // Show image immediately
    const reader = new FileReader();

    reader.onload = function (event) {

        logoPreview.src = event.target.result;

    };

    reader.readAsDataURL(file);


    // Upload to server
    uploadLogo(file);

});


// =====================================================
// UPLOAD LOGO TO BACKEND
// =====================================================

async function uploadLogo(file) {

    if (!window.laundromatId) {

        logoMessage.textContent =
            "Laundromat ID is missing.";

        console.error(
            "Laundromat ID is missing."
        );

        return;
    }


    const formData = new FormData();

    formData.append("logo", file);


    try {

        logoMessage.textContent =
            "Uploading logo...";


        const response = await fetch(
            `${API_URL}/laundromats/${window.laundromatId}/logo`,
            {
                method: "POST",
                body: formData
            }
        );


        const data = await response.json();


        console.log(
            "Logo upload response:",
            data
        );


        if (!response.ok || !data.success) {

            logoMessage.textContent =
                data.message ||
                "Logo upload failed.";

            return;
        }


        // Update image with uploaded image
        if (data.logo) {

            logoPreview.src =
                `${API_URL}/uploads/laundromats/${data.logo}`;

        }


        logoMessage.textContent =
            "Business logo updated successfully.";

    }

    catch (error) {

        console.error(
            "Logo upload error:",
            error
        );

        logoMessage.textContent =
            "Unable to upload logo.";

    }

}
// ==========================================
// DISPLAY BUSINESS NAME
// ==========================================

document.getElementById("businessName").textContent =
    loggedInUser.business_name ||
    loggedInUser.first_name ||
    "Laundromat";

document.getElementById("profileBusinessName").textContent =
    loggedInUser.business_name ||
    loggedInUser.first_name ||
    "Laundromat";


// ==========================================
// LOAD PROFILE WHEN PAGE LOADS
// ==========================================

window.onload = function () {

    loadProfile();

};


// ==========================================
// LOAD PROFILE
// ==========================================

async function loadProfile() {

    try {

        console.log(
            "Logged in user:",
            loggedInUser
        );

        const response = await fetch(

            API_URL +
            "/laundromats/user/" +
            loggedInUser.id

        );


        console.log(
            "Profile HTTP status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Profile response:",
            result
        );


        if (!result.success) {

            throw new Error(
                result.message ||
                "Unable to load profile"
            );

        }


        const profile =
            result.laundromat;


        // Save actual laundromat ID

        window.laundromatId =
            profile.id;

        console.log(
            "Laundromat ID:",
            window.laundromatId
        );


        // =====================================================
        // LOAD BUSINESS LOGO
        // =====================================================

// =====================================================
// LOAD BUSINESS LOGO
// =====================================================

        const logoPreview =
            document.getElementById("logoPreview");


        if (profile.logo) {

            logoPreview.src =
                `${API_URL}/uploads/laundromats/${profile.logo}`;

            console.log(
                "Business logo loaded:",
                profile.logo
            );

        }
        else {

            logoPreview.src =
                `${API_URL}/uploads/laundromats/default-laundry.png`;

            console.log(
                "No business logo found. Using default logo."
            );

        }


        // IMPORTANT: save the actual laundromat ID
        window.laundromatId = profile.id;

        console.log(
            "Laundromat ID:",
            window.laundromatId
        );
        // ======================================
        // BUSINESS NAME
        // ======================================

        document.getElementById(
            "businessNameInput"
        ).value =
            profile.business_name || "";


        document.getElementById(
            "profileBusinessName"
        ).textContent =
            profile.business_name || "Laundromat";


        document.getElementById(
            "businessName"
        ).textContent =
            profile.business_name || "Laundromat";


        // ======================================
        // OWNER NAME
        // ======================================

        document.getElementById(
            "ownerName"
        ).value =

            (
                (profile.first_name || "") +
                " " +
                (profile.last_name || "")
            ).trim();


        // ======================================
        // EMAIL
        // ======================================

        document.getElementById(
            "email"
        ).value =
            profile.email || "";


        // ======================================
        // PHONE
        // ======================================

        document.getElementById(
            "phone"
        ).value =
            profile.phone || "";


        // ======================================
        // BUSINESS ADDRESS
        // ======================================

        document.getElementById(
            "address"
        ).value =
            profile.business_address || "";


        console.log(
            "Profile loaded successfully."
        );

    }

    catch (error) {

        console.error(
            "Profile Error:",
            error
        );

        alert(
            "Unable to load business profile."
        );

    }

}


// ==========================================
// SAVE BUSINESS PROFILE
// ==========================================

document
.getElementById("profileForm")
.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const businessName =
            document.getElementById(
                "businessNameInput"
            ).value.trim();


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const ownerName =
            document.getElementById(
                "ownerName"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        if (!businessName) {

            alert(
                "Please enter a business name."
            );

            return;

        }


        try {

            /*
             * IMPORTANT:
             *
             * loggedInUser.id = users.id
             *
             * The PUT endpoint requires
             * laundromats.id.
             *
             * We therefore use the laundromat ID
             * returned by the GET request.
             */

            const profileResponse =
                await fetch(

                    API_URL +
                    "/laundromats/user/" +
                    loggedInUser.id

                );


            const profileResult =
                await profileResponse.json();


            if (
                !profileResult.success ||
                !profileResult.laundromat
            ) {

                alert(
                    "Unable to find your laundromat profile."
                );

                return;

            }


            const laundromatId =
                profileResult.laundromat.id;


            // ==================================
            // UPDATE DATABASE
            // ==================================

            const response =
                await fetch(

                    API_URL +
                    "/laundromats/" +
                    laundromatId,

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            business_name:
                                businessName,

                            business_address:
                                address

                        })

                    }

                );


            const result =
                await response.json();


            console.log(
                "Update response:",
                result
            );


            if (!result.success) {

                alert(
                    result.message ||
                    "Unable to update profile."
                );

                return;

            }


            // ==================================
            // UPDATE LOCAL STORAGE
            // ==================================

            loggedInUser.business_name =
                businessName;


            localStorage.setItem(

                "loggedInUser",

                JSON.stringify(
                    loggedInUser
                )

            );


            // ==================================
            // UPDATE SCREEN
            // ==================================

            document.getElementById(
                "businessName"
            ).textContent =
                businessName;


            document.getElementById(
                "profileBusinessName"
            ).textContent =
                businessName;


            alert(
                "Business profile updated successfully."
            );

        }

        catch(error) {

            console.error(
                "Update Profile Error:",
                error
            );

            alert(
                "Unable to update business profile."
            );

        }

    }
);


// ==========================================
// CHANGE PASSWORD
// ==========================================

// ==========================================
// CHANGE PASSWORD
// ==========================================

document
    .getElementById("passwordForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const currentPassword =
            document.getElementById("currentPassword").value.trim();

        const newPassword =
            document.getElementById("newPassword").value.trim();

        const confirmPassword =
            document.getElementById("confirmPassword").value.trim();


        // ==========================================
        // VALIDATION
        // ==========================================

        if (!currentPassword) {
            alert("Please enter your current password.");
            return;
        }

        if (!newPassword) {
            alert("Please enter a new password.");
            return;
        }

        if (!confirmPassword) {
            alert("Please confirm your new password.");
            return;
        }

        if (newPassword !== confirmPassword) {
            alert("New passwords do not match.");
            return;
        }


        try {

            const response = await fetch(
                API_URL + "/change-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        user_id: loggedInUser.id,
                        current_password: currentPassword,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                }
            );


            // ==========================================
            // CHECK RESPONSE
            // ==========================================

            const contentType =
                response.headers.get("content-type");


            if (!contentType ||
                !contentType.includes("application/json")) {

                const text = await response.text();

                console.error(
                    "Server returned non-JSON response:",
                    text
                );

                throw new Error(
                    "Server returned an invalid response."
                );
            }


            const result = await response.json();


            console.log(
                "Change password response:",
                result
            );


            // ==========================================
            // SERVER ERROR
            // ==========================================

            if (!response.ok) {

                alert(
                    result.message ||
                    "Unable to change password."
                );

                return;
            }


            // ==========================================
            // SUCCESS
            // ==========================================

            if (result.success) {

                alert(
                    result.message ||
                    "Password changed successfully."
                );

                document
                    .getElementById("passwordForm")
                    .reset();

            } else {

                alert(
                    result.message ||
                    "Unable to change password."
                );

            }

        }

        catch(error) {

            console.error(
                "Password Error:",
                error
            );

            alert(
                error.message ||
                "Unable to change password."
            );

        }

    });

// ==========================================
// LOGOUT
// ==========================================

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    function(e) {

        e.preventDefault();

        localStorage.removeItem(
            "loggedInUser"
        );

        window.location.href =
            "../login.html";

    }
);

</script>

</body>
</html>
