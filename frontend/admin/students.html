<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | Campus Laundry Connect</title>

    <link rel="stylesheet" href="students.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<script>
// Check if admin is logged in
let user = JSON.parse(localStorage.getItem("loggedInUser"));

if(!user || user.role !== "admin"){
    alert("Please login as Administrator.");
    window.location.href="../login.html";
}
</script>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🧺 LaundryConnect</h2>

        <p class="admin-title">Administrator</p>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>

            <li class="active"><a href="#"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

            <li><a href="laundromats.html"><i class="fa-solid fa-store"></i> Laundromats</a></li>

            <li><a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> Bookings</a></li>

            <li><a href="payments.html"><i class="fa-solid fa-credit-card"></i> Payments</a></li>

            <li><a href="reports.html"><i class="fa-solid fa-chart-column"></i> Reports</a></li>

            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>

            <li><a href="../login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

        </ul>

    </aside>

    <!-- Main -->
    <main class="main">

        <header>

            <div>
                <h1>Student Management</h1>
                <p>Manage all registered students.</p>
            </div>

            <button class="add-btn" onclick="addStudent()">
                <i class="fa-solid fa-user-plus"></i>
                Add Student
            </button>

        </header>

        <!-- Statistics -->

        <section class="stats">

            <div class="card">
                <i class="fa-solid fa-users"></i>
                <h2 id="totalStudents">0</h2>
                <p>Total Students</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-user-check"></i>
                <h2 id="activeStudents">0</h2>
                <p>Active</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-user-clock"></i>
                <h2 id="inactiveStudents">0</h2>
                <p>Inactive</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-user-plus"></i>
                <h2 id="newStudents">0</h2>
                <p>Registered</p>
            </div>

        </section>

        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchStudent"
                placeholder="Search by name, student number or email..."
                onkeyup="searchStudents()">

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <!-- Student Table -->

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Student No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </section>

    </main>

</div><script>

const API = "https://laundry-ktbs.onrender.com";

let students = [];


// =====================================================
// LOAD STUDENTS
// =====================================================

async function loadStudents() {

    try {

        const response = await fetch(`${API}/students`);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        console.log("Students API response:", result);

        if (!result.success) {

            throw new Error(
                result.message || "Unable to load students."
            );

        }

        // IMPORTANT:
        // Flask returns { success: true, students: [...] }
        students = Array.isArray(result.students)
            ? result.students
            : [];

        console.log("Students loaded:", students);

        displayStudents(students);

    }

    catch (error) {

        console.error("Load students error:", error);

        students = [];

        displayStudents([]);

        alert("Unable to load students.");

    }

}


// =====================================================
// DISPLAY STUDENTS
// =====================================================

function displayStudents(list = students) {

    const table = document.getElementById("studentTable");

    table.innerHTML = "";

    // Safety check
    if (!Array.isArray(list)) {

        console.error("displayStudents expected array:", list);

        list = [];

    }

    let active = 0;
    let inactive = 0;

    list.forEach((student) => {

        const status = student.status || "Active";

        if (status === "Active") {
            active++;
        } else {
            inactive++;
        }

        table.innerHTML += `

            <tr>

                <td>
                    ${student.student_number || "-"}
                </td>

                <td>
                    ${(student.first_name || "")}
                    ${(student.last_name || "")}
                </td>

                <td>
                    ${student.email || "-"}
                </td>

                <td>
                    ${student.phone || "-"}
                </td>

                <td>

                    <span class="${status.toLowerCase().replaceAll(" ", "-")}-status">

                        ${status}

                    </span>

                </td>

                <td>

                    <button
                        class="view"
                        onclick="viewStudent(${student.user_id})">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                    <button
                        class="edit"
                        onclick="editStudent(${student.user_id})">

                        <i class="fa-solid fa-pen"></i>

                    </button>

                    <button
                        class="delete"
                        onclick="deleteStudent(${student.user_id})">

                        <i class="fa-solid fa-trash"></i>

                    </button>

                </td>

            </tr>

        `;

    });

    // Statistics should use the complete students array
    document.getElementById("totalStudents").textContent =
        students.length;

    document.getElementById("activeStudents").textContent =
        students.filter(student =>
            (student.status || "Active") === "Active"
        ).length;

    document.getElementById("inactiveStudents").textContent =
        students.filter(student =>
            (student.status || "Active") !== "Active"
        ).length;

    document.getElementById("newStudents").textContent =
        list.length;

}

// =====================================================
// SEARCH STUDENTS
// =====================================================

function searchStudents() {

    const search =
        document
            .getElementById("searchStudent")
            .value
            .toLowerCase()
            .trim();

    const filtered = students.filter(student => {

        const firstName =
            String(student.first_name || "").toLowerCase();

        const lastName =
            String(student.last_name || "").toLowerCase();

        const studentNumber =
            String(student.student_number || "").toLowerCase();

        const email =
            String(student.email || "").toLowerCase();

        return (
            firstName.includes(search) ||
            lastName.includes(search) ||
            studentNumber.includes(search) ||
            email.includes(search)
        );

    });

    displayStudents(filtered);

}
// =====================================================
// FIND STUDENT BY ID
// =====================================================

function findStudentById(id) {

    return students.find(
        student =>
            Number(student.id) === Number(id)
    );

}


// =====================================================
// VIEW STUDENT
// =====================================================

function viewStudent(userId) {

    const student = students.find(
        student => Number(student.user_id) === Number(userId)
    );

    if (!student) {

        alert("Student not found.");

        return;

    }

    alert(`
    

    Student Number: ${student.student_number || "-"}

    Name: ${(student.first_name || "")} ${(student.last_name || "")}

    Email: ${student.email || "-"}

    Phone: ${student.phone || "-"}

    Status: ${student.status || "Active"}

        `);

}

// =====================================================
// ADD STUDENT
// =====================================================

async function addStudent() {

    const studentNumber =
        prompt("Student Number:");

    if (!studentNumber) return;


    const firstName =
        prompt("First Name:");

    if (!firstName) return;


    const lastName =
        prompt("Last Name:");

    if (!lastName) return;


    const email =
        prompt("Email:");

    if (!email) return;


    const phone =
        prompt("Phone Number:");

    if (!phone) return;


    try {

        const response =
            await fetch(
                `${API}/students`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        student_number:
                            studentNumber,

                        first_name:
                            firstName,

                        last_name:
                            lastName,

                        email:
                            email,

                        phone:
                            phone

                    })

                }
            );


        const result =
            await response.json();


        console.log(
            "Add student response:",
            result
        );


        alert(
            result.message ||
            "Student added successfully."
        );


        if (response.ok) {

            loadStudents();

        }

    }

    catch (error) {

        console.error(
            "Add Student Error:",
            error
        );

        alert(
            "Unable to add student."
        );

    }

}


// =====================================================
// EDIT STUDENT
// =====================================================

async function editStudent(userId) {

    const student = students.find(
        student => Number(student.user_id) === Number(userId)
    );

    if (!student) {

        alert("Student not found.");

        return;

    }

    const firstName = prompt(
        "First Name",
        student.first_name || ""
    );

    if (firstName === null) return;

    const lastName = prompt(
        "Last Name",
        student.last_name || ""
    );

    if (lastName === null) return;

    const email = prompt(
        "Email",
        student.email || ""
    );

    if (email === null) return;

    const phone = prompt(
        "Phone",
        student.phone || ""
    );

    if (phone === null) return;

    const status = prompt(
        "Status: Active / Inactive",
        student.status || "Active"
    );

    if (status === null) return;

    try {

        const response = await fetch(
            `${API}/students/${student.user_id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    first_name: firstName,

                    last_name: lastName,

                    email: email,

                    phone: phone,

                    status: status

                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {

            throw new Error(
                result.message ||
                "Unable to update student."
            );

        }

        alert(result.message);

        await loadStudents();

    }

    catch (error) {

        console.error("Edit student error:", error);

        alert(error.message);

    }

}

// =====================================================
// DELETE STUDENT
// =====================================================

async function deleteStudent(userId) {

    if (!confirm("Delete this student?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/students/${userId}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {

            throw new Error(
                result.message ||
                "Unable to delete student."
            );

        }

        alert(result.message);

        await loadStudents();

    }

    catch (error) {

        console.error("Delete student error:", error);

        alert(error.message);

    }

}

// =====================================================
// START PAGE
// =====================================================

loadStudents();

</script>

</body>
</html>
