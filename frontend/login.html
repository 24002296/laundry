<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Laundry Connect</title>

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://accounts.google.com/gsi/client" async></script>

</head>

<body>

<div class="container">

    <!-- Right Side -->

    <div class="right">

        <form id="loginForm">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to continue
            </p>

            <!-- Email -->

            <div class="input-box">

                <label>Email Address</label>

                <div class="input-field">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

                </div>

            </div>

            <!-- Password -->

            <div class="input-box">

                <label>Password</label>

                <div class="input-field">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

                </div>

            </div>

            <!-- User Role -->

            <div class="role-selection">

                <label class="role-title">
                    Login As
                </label>

                <div class="roles">

                    <label>

                        <input
                        type="radio"
                        name="role"
                        value="student"
                        required>

                        Student

                    </label>

                    <label>

                        <input
                        type="radio"
                        name="role"
                        value="laundromat">

                        Laundromat

                    </label>

                    <label>

                        <input
                        type="radio"
                        name="role"
                        value="admin">

                        Administrator

                    </label>

                </div>

            </div>

            <!-- Remember -->

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->

            <button type="submit">

                Login

            </button>

            <div class="divider">

                OR

            </div>

            <!-- Google -->

            <div
                id="g_id_onload"
                data-client_id="260950180361-6mu307ht07g19btgdo0imfepd1q0f8kf.apps.googleusercontent.com"
                data-callback="handleGoogleLogin"
                data-auto_prompt="false">
            </div>

            <div
                class="g_id_signin"
                data-type="standard"
                data-size="large"
                data-theme="outline"
                data-text="continue_with"
                data-shape="rectangular">
            </div>

            <!-- Register -->

            <p class="register">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </form>

    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            alert("Please enter email and password.");

            return;

        }


        try {

            const response = await fetch(
                "http://127.0.0.1:5000/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const result = await response.json();


            if (!response.ok || !result.success) {

                alert(
                    result.message ||
                    "Login failed."
                );

                return;

            }


            // ============================================
            // LOGGED-IN USER
            // ============================================

            const user = result.user;


            // Save user
            localStorage.setItem(
                "loggedInUser",
                JSON.stringify(user)
            );


            console.log("LOGGED IN USER:", user);


            // ============================================
            // ADMIN
            // ============================================
            // ADMIN DOES NOT NEED SUBSCRIPTION

            if (user.role === "admin") {

                alert("Login successful!");

                window.location.href =
                    "admin/dashboard.html";

                return;
            }


            // ============================================
            // STUDENT / LAUNDROMAT
            // ============================================

            if (
                user.role === "student" ||
                user.role === "laundromat"
            ) {

                await checkSubscription(user);

                return;
            }


            // ============================================
            // UNKNOWN ROLE
            // ============================================

            alert("Unknown account role.");

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );

            alert(
                "Unable to connect to the server. " +
                "Make sure the Python backend is running."
            );

        }

    }
);


// ========================================================
// CHECK SUBSCRIPTION
// ========================================================

async function checkSubscription(user) {

    try {

        const response = await fetch(
            `http://127.0.0.1:5000/subscriptions/user/${user.id}`
        );


        const result = await response.json();


        console.log(
            "SUBSCRIPTION RESULT:",
            result
        );


        // =================================================
        // SUBSCRIBED
        // =================================================

        if (
            response.ok &&
            result.success &&
            result.subscribed
        ) {

            alert("Login successful!");


            if (user.role === "student") {

                window.location.href =
                    "student/dashboard.html";

            }

            else if (user.role === "laundromat") {

                window.location.href =
                    "laundromat/dashboard.html";

            }

            return;
        }


        // =================================================
        // NOT SUBSCRIBED
        // =================================================

        if (user.role === "student") {

            window.location.href =
                "student/subscription.html";

        }

        else if (user.role === "laundromat") {

            window.location.href =
                "laundromat/subscription.html";

        }

    }

    catch (error) {

        console.error(
            "SUBSCRIPTION ERROR:",
            error
        );

        alert(
            "Unable to check subscription."
        );

    }

}

</script>

<script>

async function handleGoogleLogin(response) {

    console.log(
        "Google response received."
    );


    if (!response || !response.credential) {

        alert(
            "Google login failed."
        );

        return;

    }


    try {

        const backendResponse =
            await fetch(
                "http://127.0.0.1:5000/google-login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        credential:
                            response.credential

                    })

                }
            );


        const result =
            await backendResponse.json();


        console.log(
            "Google login result:",
            result
        );


        if (
            !backendResponse.ok ||
            !result.success
        ) {

            alert(
                result.message ||
                "Google login failed."
            );

            return;

        }


        // Save user

        localStorage.setItem(
            "loggedInUser",
            JSON.stringify(
                result.user
            )
        );


        alert(
            "Google login successful!"
        );


        // ------------------------------------------------
        // REDIRECT BASED ON ROLE
        // ------------------------------------------------

        if (
            result.user.role === "admin"
        ) {

            window.location.href =
                "admin/dashboard.html";

        }

        else if (
            result.user.role === "student"
        ) {

            window.location.href =
                "student/dashboard.html";

        }

        else if (
            result.user.role === "laundromat"
        ) {

            window.location.href =
                "laundromat/dashboard.html";

        }

        else {

            alert(
                "Unknown account role."
            );

        }

    }

    catch (error) {

        console.error(
            "GOOGLE LOGIN ERROR:",
            error
        );


        alert(
            "Unable to connect to the server."
        );

    }

}

</script>
</body>
</html>
