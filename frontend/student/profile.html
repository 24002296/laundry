<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Campus Laundry Connect</title>

    <link rel="stylesheet" href="profile.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🧺 LaundryConnect</h2>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

            <li><a href="laundromats.html"><i class="fa-solid fa-store"></i> Laundromats</a></li>

            <li><a href="book-laundry.html"><i class="fa-solid fa-calendar-check"></i> Book Laundry</a></li>

            <li><a href="my-orders.html"><i class="fa-solid fa-box"></i> My Orders</a></li>

            <li><a href="track-order.html"><i class="fa-solid fa-location-dot"></i> Track Order</a></li>

            <li class="active"><a href="#"><i class="fa-solid fa-user"></i> My Profile</a></li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <h1>My Profile</h1>

        <div class="profile-card">

            <!-- ============================= -->
            <!-- PROFILE HEADER -->
            <!-- ============================= -->

            <div class="profile-header">

                <div class="profile-picture-section">

                    <img
                        id="profilePicture"
                        src="../images/default-profile.png"
                        alt="Profile Picture"
                        class="profile-picture"
                    >

                    <input
                        type="file"
                        id="profilePictureInput"
                        accept="image/png,image/jpeg,image/webp"
                        hidden
                    >

                    <button
                        type="button"
                        id="chooseProfilePictureBtn"
                        class="change-picture-btn">

                        <i class="fa-solid fa-camera"></i>

                        Change Profile Picture

                    </button>

                    <p id="profilePictureMessage"></p>

                </div>

                <div class="profile-name">

                    <h2 id="displayName">
                        Student Name
                    </h2>

                    <p id="displayRole">
                        Student
                    </p>

                </div>

            </div>


            <!-- ============================= -->
            <!-- PERSONAL INFORMATION -->
            <!-- ============================= -->

            <div class="personal-information">

                <div class="section-title">

                    <i class="fa-solid fa-user"></i>

                    <h2>Personal Information</h2>

                </div>


                <form id="profileForm">

                    <div class="form-grid">

                        <!-- First Name -->

                        <div class="input-box">

                            <label for="firstName">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="firstName"
                                required
                            >

                        </div>


                        <!-- Last Name -->

                        <div class="input-box">

                            <label for="lastName">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="lastName"
                                required
                            >

                        </div>


                        <!-- Student Number -->

                        <div class="input-box">

                            <label for="studentNumber">
                                Student Number
                            </label>

                            <input
                                type="text"
                                id="studentNumber"
                                readonly
                            >

                        </div>


                        <!-- Email -->

                        <div class="input-box">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                required
                            >

                        </div>


                        <!-- Phone -->

                        <div class="input-box">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                id="phone"
                                required
                            >

                        </div>


                        <!-- Residence -->

                        <div class="input-box">

                            <label for="residence">
                                Residence
                            </label>

                            <input
                                type="text"
                                id="residence"
                                placeholder="Campus Residence"
                            >

                        </div>

                    </div>


                    <!-- Pickup Instructions -->

                    <div class="input-box instructions-box">

                        <label for="instructions">
                            Pickup Instructions
                        </label>

                        <textarea
                            id="instructions"
                            placeholder="Special pickup instructions">
                        </textarea>

                    </div>


                    <div class="save-container">

                        <button
                            type="submit"
                            class="save-btn">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Changes

                        </button>

                    </div>

                </form>

            </div>

        </div>

        <!-- Change Password -->

        <div class="password-card">

            <h2>Change Password</h2>

            <form id="passwordForm">

                <div class="input-box">

                    <label>Current Password</label>

                    <input
                    type="password"
                    id="currentPassword"
                    required>

                </div>

                <div class="input-box">

                    <label>New Password</label>

                    <input
                    type="password"
                    id="newPassword"
                    required>

                </div>

                <div class="input-box">

                    <label>Confirm Password</label>

                    <input
                    type="password"
                    id="confirmPassword"
                    required>

                </div>

                <button
                type="submit"
                class="password-btn">

                    Update Password

                </button>

            </form>

        </div>

    </main>

</div>

<script>

const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user || user.role !== "student") {

    alert("Please login first.");

    window.location.href = "../login.html";

}


// Display Name
document.getElementById("displayName").textContent =
    user.first_name + " " + user.last_name;

document.getElementById("displayRole").textContent = "Student";

const API_URL = "https://laundry-ktbs.onrender.com";

const loggedInUser =
    JSON.parse(
        localStorage.getItem("loggedInUser")
    );


const profilePicture =
    document.getElementById("profilePicture");

const profilePictureInput =
    document.getElementById("profilePictureInput");

const chooseProfilePictureBtn =
    document.getElementById(
        "chooseProfilePictureBtn"
    );

const profilePictureMessage =
    document.getElementById(
        "profilePictureMessage"
    );


// =====================================================
// OPEN FILE SELECTOR
// =====================================================

chooseProfilePictureBtn.addEventListener(
    "click",
    function () {

        profilePictureInput.click();

    }
);


// =====================================================
// SELECT PROFILE PICTURE
// =====================================================

profilePictureInput.addEventListener(
    "change",
    function () {

        const file =
            profilePictureInput.files[0];

        if (!file) {
            return;
        }


        // Show preview immediately
        const reader =
            new FileReader();

        reader.onload =
            function (event) {

                profilePicture.src =
                    event.target.result;

            };

        reader.readAsDataURL(file);


        // Upload
        uploadProfilePicture(file);

    }
);


// =====================================================
// UPLOAD PROFILE PICTURE
// =====================================================

async function uploadProfilePicture(file) {

    if (!loggedInUser || !loggedInUser.id) {

        alert(
            "Student ID not found. Please login again."
        );

        return;

    }


    const formData =
        new FormData();


    formData.append(
        "profile_picture",
        file
    );


    try {

        profilePictureMessage.textContent =
            "Uploading profile picture...";


        const response =
            await fetch(

                API_URL +
                "/students/" +
                loggedInUser.id +
                "/profile-picture",

                {
                    method: "POST",
                    body: formData
                }

            );


        const result =
            await response.json();


        console.log(
            "Profile picture response:",
            result
        );


        if (!response.ok || !result.success) {

            profilePictureMessage.textContent =
                result.message ||
                "Upload failed.";

            return;

        }


        profilePictureMessage.textContent =
            "Profile picture updated successfully.";


        // Display uploaded image
        if (result.profile_picture) {

            profilePicture.src =
                API_URL +
                "/uploads/students/" +
                result.profile_picture;

        }

    }

    catch (error) {

        console.error(
            "Profile picture upload error:",
            error
        );


        profilePictureMessage.textContent =
            "Unable to upload profile picture.";

    }

}
// Load Profile
async function loadProfile() {

    try {

        const response = await fetch(
            `${API_URL}/students/${user.id}`
        );

        const data = await response.json();

        console.log("Student profile:", data);

        if (!response.ok || !data.success) {

            alert(data.message || "Unable to load profile.");

            return;

        }

        const student = data.student;

        // ==============================
        // PERSONAL INFORMATION
        // ==============================

        document.getElementById("firstName").value =
            student.first_name || "";

        document.getElementById("lastName").value =
            student.last_name || "";

        document.getElementById("studentNumber").value =
            student.student_number || "";

        document.getElementById("email").value =
            student.email || "";

        document.getElementById("phone").value =
            student.phone || "";

        document.getElementById("residence").value =
            student.residence || "";

        document.getElementById("instructions").value =
            student.instructions || "";


        // ==============================
        // PROFILE PICTURE
        // ==============================

        if (student.profile_picture) {

            profilePicture.src =
                `${API_URL}/uploads/students/${student.profile_picture}`;

        }

        else {

            profilePicture.src =
                "https://via.placeholder.com/150";

        }


        // ==============================
        // DISPLAY NAME
        // ==============================

        document.getElementById("displayName").textContent =
            `${student.first_name || ""} ${student.last_name || ""}`.trim();

    }

    catch (error) {

        console.error("Load profile error:", error);

        alert("Unable to load profile.");

    }

}
console.log(user);
console.log("User ID:", user.id);
loadProfile();


// Update Profile
// Update Profile
document.getElementById("profileForm").addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        try {

            const response = await fetch(

                `https://laundry-ktbs.onrender.com/students/${user.id}`,

                {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        first_name:
                            document.getElementById("firstName").value,

                        last_name:
                            document.getElementById("lastName").value,

                        email:
                            document.getElementById("email").value,

                        phone:
                            document.getElementById("phone").value,

                        residence:
                            document.getElementById("residence").value,

                        instructions:
                            document.getElementById("instructions").value

                    })

                }

            );

            const data = await response.json();

            alert(data.message);

            if (data.success) {

                user.first_name =
                    document.getElementById("firstName").value;

                user.last_name =
                    document.getElementById("lastName").value;

                user.email =
                    document.getElementById("email").value;

                user.phone =
                    document.getElementById("phone").value;

                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(user)
                );

            }

        }

        catch(error) {

            console.log(error);

            alert("Unable to update profile.");

        }

    }
);


// Change Password
document.getElementById("passwordForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const currentPassword =
        document.getElementById("currentPassword").value;

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(newPassword !== confirmPassword){

        alert("Passwords do not match.");

        return;

    }

    try{

        const response = await fetch(

            "https://laundry-ktbs.onrender.com/change-password",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    user_id:user.id,

                    current_password:currentPassword,

                    new_password:newPassword

                })

            }

        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            document.getElementById("passwordForm").reset();

        }

    }

    catch(error){

        console.log(error);

        alert("Unable to change password.");

    }

});


// Logout
document.getElementById("logoutBtn").addEventListener("click",function(e){

    e.preventDefault();

    localStorage.removeItem("loggedInUser");

    window.location.href="../login.html";

});
</script>

</body>
</html>
