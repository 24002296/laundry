<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LaundryConnect - Booking Payment</title>

    <link rel="stylesheet"
          href="booking-payment.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="payment-page">

    <!-- HEADER -->

    <header class="payment-header">

        <div class="logo">
            🧺 LaundryConnect
        </div>

        <button
            class="logout-btn"
            onclick="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </header>


    <!-- PAYMENT CONTAINER -->

    <main class="payment-container">


        <div class="payment-card">


            <!-- ICON -->

            <div class="payment-icon">

                <i class="fa-solid fa-credit-card"></i>

            </div>


            <h1>
                Complete Your Payment
            </h1>


            <p class="subtitle">

                Pay for your laundry booking to
                confirm your order.

            </p>


            <!-- BOOKING SUMMARY -->

            <div class="booking-summary">

                <h2>
                    Booking Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Booking Number
                    </span>

                    <strong id="bookingNumber">
                        -
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Laundromat
                    </span>

                    <strong id="laundromat">
                        -
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Service
                    </span>

                    <strong id="service">
                        -
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Pickup Date
                    </span>

                    <strong id="pickupDate">
                        -
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Pickup Time
                    </span>

                    <strong id="pickupTime">
                        -
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Loads
                    </span>

                    <strong id="loads">
                        -
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Weight
                    </span>

                    <strong id="weight">
                        -
                    </strong>

                </div>


                <div class="summary-total">

                    <span>
                        Total Amount
                    </span>

                    <strong id="amount">
                        R0.00
                    </strong>

                </div>

            </div>


            <!-- PAYMENT FORM -->

            <form id="paymentForm">


                <label for="paymentMethod">

                    Payment Method

                </label>


                <select
                    id="paymentMethod"
                    required>

                    <option value="card">
                        Credit / Debit Card
                    </option>

                    <option value="eft">
                        EFT
                    </option>

                    <option value="wallet">
                        Digital Wallet
                    </option>

                </select>


                <!-- CARD DETAILS -->

                <div id="cardDetails">


                    <label for="cardNumber">

                        Card Number

                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        placeholder="1234 5678 9012 3456"
                        maxlength="19">


                    <div class="card-row">


                        <div>

                            <label for="expiry">

                                Expiry Date

                            </label>

                            <input
                                type="text"
                                id="expiry"
                                placeholder="MM/YY"
                                maxlength="5">

                        </div>


                        <div>

                            <label for="cvv">

                                CVV

                            </label>

                            <input
                                type="password"
                                id="cvv"
                                placeholder="***"
                                maxlength="4">

                        </div>

                    </div>

                </div>


                <!-- PAY BUTTON -->

                <button
                    type="submit"
                    class="pay-btn">

                    <i class="fa-solid fa-lock"></i>

                    Pay Now

                </button>


            </form>


            <p class="secure">

                <i class="fa-solid fa-shield-halved"></i>

                Your payment is securely processed.

            </p>


            <button
                class="back-btn"
                onclick="goBack()">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Booking

            </button>


        </div>

    </main>

</div>


<script>

// ============================================================
// API
// ============================================================

const API_URL =
    "http://127.0.0.1:5000";


// ============================================================
// GET USER
// ============================================================

const user =
    JSON.parse(
        localStorage.getItem(
            "loggedInUser"
        )
    );


if (!user) {

    alert(
        "Please login first."
    );

    window.location.href =
        "../login.html";

}


// ============================================================
// GET PENDING BOOKING
// ============================================================

const pendingBooking =
    JSON.parse(
        localStorage.getItem(
            "pendingBooking"
        )
    );


if (
    !pendingBooking ||
    !pendingBooking.user_id
) {

    alert(
        "No booking selected for payment."
    );

    window.location.href =
        "book-laundry.html";

}


// ============================================================
// DOM ELEMENTS
// ============================================================

const bookingNumberElement =
    document.getElementById(
        "bookingNumber"
    );

const laundromatElement =
    document.getElementById(
        "laundromat"
    );

const serviceElement =
    document.getElementById(
        "service"
    );

const pickupDateElement =
    document.getElementById(
        "pickupDate"
    );

const pickupTimeElement =
    document.getElementById(
        "pickupTime"
    );

const loadsElement =
    document.getElementById(
        "loads"
    );

const weightElement =
    document.getElementById(
        "weight"
    );

const amountElement =
    document.getElementById(
        "amount"
    );

const paymentMethodElement =
    document.getElementById(
        "paymentMethod"
    );

const cardDetailsElement =
    document.getElementById(
        "cardDetails"
    );

const paymentForm =
    document.getElementById(
        "paymentForm"
    );

const payButton =
    document.querySelector(
        ".pay-btn"
    );


// ============================================================
// DISPLAY PENDING BOOKING
// ============================================================

function displayPendingBooking() {

    if (!pendingBooking) {
        return;
    }


    if (bookingNumberElement) {

        bookingNumberElement.textContent =
            "Pending Payment";

    }


    if (laundromatElement) {

        /*
         We only have the laundromat ID
         at this stage.

         The actual booking is not yet
         in the bookings table.
        */

        laundromatElement.textContent =
            "Laundromat #" +
            pendingBooking.laundromat_id;

    }


    if (serviceElement) {

        serviceElement.textContent =
            pendingBooking.service ||
            "-";

    }


    if (pickupDateElement) {

        pickupDateElement.textContent =
            pendingBooking.pickup_date ||
            "-";

    }


    if (pickupTimeElement) {

        pickupTimeElement.textContent =
            pendingBooking.pickup_time ||
            "-";

    }


    if (loadsElement) {

        loadsElement.textContent =
            pendingBooking.loads ||
            "0";

    }


    if (weightElement) {

        weightElement.textContent =
            pendingBooking.weight ||
            "0";

    }


    if (amountElement) {

        amountElement.textContent =
            "R" +
            Number(
                pendingBooking.amount ||
                0
            ).toFixed(2);

    }

}


// ============================================================
// PAYMENT METHOD
// ============================================================

if (paymentMethodElement) {

    paymentMethodElement.addEventListener(
        "change",
        function() {

            if (!cardDetailsElement) {
                return;
            }


            if (
                this.value === "card"
            ) {

                cardDetailsElement.style.display =
                    "block";

            }

            else {

                cardDetailsElement.style.display =
                    "none";

            }

        }
    );

}


// ============================================================
// CARD NUMBER FORMAT
// ============================================================

const cardNumber =
    document.getElementById(
        "cardNumber"
    );


if (cardNumber) {

    cardNumber.addEventListener(
        "input",
        function() {

            let value =
                this.value.replace(
                    /\D/g,
                    ""
                );


            value =
                value.substring(
                    0,
                    16
                );


            const groups =
                value.match(
                    /.{1,4}/g
                );


            this.value =
                groups
                    ? groups.join(" ")
                    : "";

        }
    );

}


// ============================================================
// EXPIRY FORMAT
// ============================================================

const expiry =
    document.getElementById(
        "expiry"
    );


if (expiry) {

    expiry.addEventListener(
        "input",
        function() {

            let value =
                this.value.replace(
                    /\D/g,
                    ""
                );


            value =
                value.substring(
                    0,
                    4
                );


            if (
                value.length >= 3
            ) {

                value =
                    value.substring(
                        0,
                        2
                    ) +
                    "/" +
                    value.substring(
                        2
                    );

            }


            this.value =
                value;

        }
    );

}


// ============================================================
// PAYMENT SUBMISSION
// ============================================================

if (paymentForm) {

    paymentForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            // -----------------------------------------------
            // CHECK USER
            // -----------------------------------------------

            if (!user) {

                alert(
                    "Please login first."
                );

                return;

            }


            // -----------------------------------------------
            // CHECK PENDING BOOKING
            // -----------------------------------------------

            if (
                !pendingBooking ||
                !pendingBooking.user_id
            ) {

                alert(
                    "No booking selected for payment."
                );

                return;

            }


            // -----------------------------------------------
            // PAYMENT METHOD
            // -----------------------------------------------

            const method =
                paymentMethodElement
                    ? paymentMethodElement.value
                    : "";


            if (!method) {

                alert(
                    "Please select a payment method."
                );

                return;

            }


            // -----------------------------------------------
            // DISABLE PAY BUTTON
            // -----------------------------------------------

            if (payButton) {

                payButton.disabled =
                    true;

                payButton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

            }


            try {

                console.log(
                    "================================="
                );

                console.log(
                    "PROCESSING PAYMENT"
                );

                console.log(
                    "PENDING BOOKING:",
                    pendingBooking
                );

                console.log(
                    "USER:",
                    user.id
                );

                console.log(
                    "METHOD:",
                    method
                );

                console.log(
                    "================================="
                );


                // -------------------------------------------
                // SEND BOOKING + PAYMENT TO FLASK
                // -------------------------------------------

                const response =
                    await fetch(
                        API_URL +
                        "/booking-payments",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    booking:
                                        pendingBooking,

                                    user_id:
                                        Number(
                                            user.id
                                        ),

                                    payment_method:
                                        method

                                })

                        }
                    );


                console.log(
                    "PAYMENT HTTP STATUS:",
                    response.status
                );


                const result =
                    await response.json();


                console.log(
                    "PAYMENT RESPONSE:",
                    result
                );


                // -------------------------------------------
                // CHECK HTTP
                // -------------------------------------------

                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Payment failed."
                    );

                }


                // -------------------------------------------
                // CHECK SUCCESS
                // -------------------------------------------

                if (!result.success) {

                    throw new Error(
                        result.message ||
                        "Payment failed."
                    );

                }


                // -------------------------------------------
                // SUCCESS
                // -------------------------------------------

                alert(
                    "Payment successful!\n\n" +
                    "Booking Number: " +
                    result.booking_number +
                    "\n\n" +
                    "Transaction ID: " +
                    result.transaction_id +
                    "\n\n" +
                    "Your booking has been confirmed."
                );


                // -------------------------------------------
                // REMOVE TEMPORARY BOOKING
                // -------------------------------------------

                localStorage.removeItem(
                    "pendingBooking"
                );


                localStorage.removeItem(
                    "selectedLaundromat"
                );


                // -------------------------------------------
                // REDIRECT
                // -------------------------------------------

                window.location.href =
                    "my-orders.html";

            }


            catch(error) {

                console.error(
                    "PAYMENT ERROR:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to process payment."
                );


                if (payButton) {

                    payButton.disabled =
                        false;

                    payButton.innerHTML =
                        '<i class="fa-solid fa-lock"></i> Pay Now';

                }

            }

        }
    );

}


// ============================================================
// BACK
// ============================================================

function goBack() {

    /*
     Remove temporary booking because
     the student is cancelling payment.
    */

    localStorage.removeItem(
        "pendingBooking"
    );


    window.location.href =
        "book-laundry.html";

}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

    localStorage.removeItem(
        "loggedInUser"
    );

    localStorage.removeItem(
        "pendingBooking"
    );

    localStorage.removeItem(
        "selectedLaundromat"
    );

    window.location.href =
        "../login.html";

}


// ============================================================
// START
// ============================================================

displayPendingBooking();

</script>
</body>

</html>
