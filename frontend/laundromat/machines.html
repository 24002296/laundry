<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Machines | Campus Laundry Connect</title>

    <link rel="stylesheet" href="machines.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<script>

// Allow only laundromats

let user = JSON.parse(localStorage.getItem("loggedInUser"));

if(!user || user.role !== "laundromat"){

    alert("Please login as a laundromat.");

    window.location.href="../login.html";

}

</script>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🧺 LaundryConnect</h2>

        <p class="business" id="businessName"></p>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>

            <li><a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> Bookings</a></li>

            <li><a href="services.html"><i class="fa-solid fa-soap"></i> Services</a></li>

            <li class="active"><a href="#"><i class="fa-solid fa-gears"></i> Machines</a></li>

            <li><a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a></li>

            <li><a href="reports.html"><i class="fa-solid fa-chart-column"></i> Reports</a></li>

            <li><a href="profile.html"><i class="fa-solid fa-user"></i> Business Profile</a></li>

            <li>
                <a href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <header>

            <div>

                <h1>Machine Management</h1>

                <p>Monitor and manage washing machines and dryers.</p>

            </div>

            <button class="add-btn" onclick="addMachine()">

                <i class="fa-solid fa-plus"></i>

                Add Machine

            </button>

        </header>

        <!-- Summary -->

        <section class="summary">

            <div class="card">

                <i class="fa-solid fa-check-circle"></i>

                <h2 id="availableCount">0</h2>

                <p>Available</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-spinner"></i>

                <h2 id="busyCount">0</h2>

                <p>In Use</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                <h2 id="maintenanceCount">0</h2>

                <p>Maintenance</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-gears"></i>

                <h2 id="totalMachines">0</h2>

                <p>Total Machines</p>

            </div>

        </section>

        <!-- Machine List -->

        <section class="machines" id="machinesContainer">

        </section>

            </main>

</div>

<script>
const API_URL = "http://127.0.0.1:5000";


document.getElementById("businessName").textContent =
    user.business_name || user.first_name;

let machines = [];

window.onload = function () {

    loadMachines();

};

// Load machines
async function loadMachines() {

    try {

        const response = await fetch(
            API_URL + "/machines/laundromat/" + user.id
        );

        console.log("Machines response status:", response.status);

        const result = await response.json();

        console.log("Machines response:", result);

        if (!result.success) {

            alert(result.message || "Unable to load machines.");

            return;
        }

        // IMPORTANT:
        // Flask returns { success: true, machines: [...] }
        machines = result.machines || [];

        displayMachines();

    }

    catch (error) {

        console.error("Machine Loading Error:", error);

        alert("Unable to load machines.");

    }

}
function displayMachines() {

    let container =
        document.getElementById("machinesContainer");

    container.innerHTML = "";

    let available = 0;
    let busy = 0;
    let maintenance = 0;

    machines.forEach((machine, index) => {

        if (machine.status === "Available")
            available++;

        if (machine.status === "In Use")
            busy++;

        if (machine.status === "Maintenance")
            maintenance++;

        let cssClass = "available";

        if (machine.status === "In Use")
            cssClass = "busy";

        if (machine.status === "Maintenance")
            cssClass = "maintenance";

        let icon =
            machine.type === "Dryer"
            ? "fa-wind"
            : "fa-shirt";

        container.innerHTML += `

        <div class="machine ${cssClass}">

            <i class="fa-solid ${icon}"></i>

            <h3>${machine.name}</h3>

            <p>Status: ${machine.status}</p>

            <button onclick="changeStatus(${index})">

                Update Status

            </button>

            <button
                onclick="deleteMachine(${machine.id})"
                style="margin-top:10px;background:red;color:white;">

                Delete

            </button>

        </div>

        `;

    });

    document.getElementById("availableCount").textContent =
        available;

    document.getElementById("busyCount").textContent =
        busy;

    document.getElementById("maintenanceCount").textContent =
        maintenance;

    document.getElementById("totalMachines").textContent =
        machines.length;

}

// Add Machine
async function addMachine() {

    let type = prompt("Machine Type (Washer/Dryer)");

    if (!type) return;

    type = type.trim();

    if (
        type.toLowerCase() !== "washer" &&
        type.toLowerCase() !== "dryer"
    ) {
        alert("Please enter Washer or Dryer.");
        return;
    }

    let number = prompt("Machine Number");

    if (!number) return;

    try {

        const response = await fetch(
            API_URL + "/machines",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    laundromat_id: user.id,

                    name: type + " " + number,

                    type:
                        type.charAt(0).toUpperCase() +
                        type.slice(1).toLowerCase(),

                    status: "Available"

                })
            }
        );

        const result = await response.json();

        console.log(result);

        alert(result.message);

        if (result.success) {

            loadMachines();

        }

    }
    catch (error) {

        console.error("Add Machine Error:", error);

        alert("Unable to add machine.");

    }

}

// Update Machine Status
async function changeStatus(index) {

    let status = prompt(

        "Enter Status:\nAvailable\nIn Use\nMaintenance",

        machines[index].status

    );

    if (!status) return;

    try {

        const response = await fetch(

            API_URL + "/machines/" + machines[index].id,

            {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    status: status

                })

            }

        );

        const result = await response.json();

        alert(result.message);

        if (result.success) {

            loadMachines();

        }

    }

    catch (error) {

        console.error("Update Machine Error:", error);

        alert("Unable to update machine.");

    }

}

// Delete Machine
async function deleteMachine(id) {

    if (!confirm("Delete this machine?")) {
        return;
    }

    try {

        const response = await fetch(

            API_URL + "/machines/" + id,

            {
                method: "DELETE"
            }

        );

        const result = await response.json();

        alert(result.message);

        if (result.success) {

            loadMachines();

        }

    }

    catch (error) {

        console.error("Delete Machine Error:", error);

        alert("Unable to delete machine.");

    }

}

</script>

</body>
</html>
