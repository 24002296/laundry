<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services | Campus Laundry Connect</title>

    <link rel="stylesheet" href="services.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<script>

// ===============================
// CHECK LOGIN
// ===============================


</script>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🧺 LaundryConnect</h2>

        <p class="business" id="businessName">
            Loading...
        </p>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-soap"></i>
                    Services
                </a>
            </li>

            <li>
                <a href="machines.html">
                    <i class="fa-solid fa-gears"></i>
                    Machines
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="fa-solid fa-user"></i>
                    Business Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <header>

            <div>

                <h1>Manage Laundry Services</h1>

                <p>
                    Add, edit or remove laundry services.
                </p>

            </div>

        </header>

        <!-- Service Form -->

        <section class="card">

            <h2>Add / Edit Service</h2>

            <form id="serviceForm">

                <input
                    type="hidden"
                    id="serviceIndex"
                >

                <div class="row">

                    <div class="input-box">

                        <label>Service Name</label>

                        <input
                            type="text"
                            id="serviceName"
                            required
                        >

                    </div>

                    <div class="input-box">

                        <label>Price (R)</label>

                        <input
                            type="number"
                            id="servicePrice"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="input-box">

                        <label>Estimated Duration</label>

                        <input
                            type="text"
                            id="serviceDuration"
                            placeholder="2 Hours"
                            required
                        >

                    </div>

                    <div class="input-box">

                        <label>Status</label>

                        <select id="serviceStatus">

                            <option>Available</option>

                            <option>Unavailable</option>

                        </select>

                    </div>

                </div>

                <div class="input-box">

                    <label>Description</label>

                    <textarea
                        id="serviceDescription"
                        rows="4"
                    ></textarea>

                </div>

                <button
                    class="save-btn"
                    type="submit"
                >

                    Save Service

                </button>

            </form>

        </section>

        <!-- Existing Services -->

        <section class="card">

            <h2>Available Services</h2>

            <table>

                <thead>

                    <tr>

                        <th>Service</th>

                        <th>Price</th>

                        <th>Duration</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="servicesTable">
                                    </tbody>

            </table>

        </section>

    </main>

</div>
<script>

const API_URL = "http://127.0.0.1:5000";


// ==========================================
// CHECK LOGIN
// ==========================================

const user = JSON.parse(
    localStorage.getItem("loggedInUser")
);

console.log("Services - logged in user:", user);

if (!user || user.role !== "laundromat") {

    alert("Please login first.");

    window.location.href = "../login.html";

}


// ==========================================
// VARIABLES
// ==========================================

let services = [];

let laundromatId = null;


// ==========================================
// DISPLAY BUSINESS NAME
// ==========================================

document.getElementById("businessName").textContent =
    user.business_name ||
    ((user.first_name || "") + " " + (user.last_name || ""));


// ==========================================
// PAGE LOAD
// ==========================================

window.addEventListener("DOMContentLoaded", async function () {

    await getLaundromat();

    if (laundromatId) {

        await loadServices();

    }

});


// ==========================================
// GET ACTUAL LAUNDROMAT
// ==========================================

async function getLaundromat() {

    try {

        console.log(
            "Getting laundromat for user:",
            user.id
        );

        const response = await fetch(

            `${API_URL}/laundromats/user/${user.id}`

        );

        const data = await response.json();

        console.log(
            "Laundromat response:",
            data
        );

        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Laundromat profile not found."
            );

            return;

        }

        // IMPORTANT:
        // This is the actual laundromat ID

        laundromatId =
            data.laundromat.id;

        console.log(
            "Actual laundromat ID:",
            laundromatId
        );

    }

    catch (error) {

        console.error(
            "Laundromat error:",
            error
        );

        alert(
            "Unable to load laundromat."
        );

    }

}


// ==========================================
// LOAD SERVICES FROM DATABASE
// ==========================================

async function loadServices() {

    if (!laundromatId) {

        console.error(
            "No laundromat ID available."
        );

        return;

    }

    try {

        console.log(
            "Loading services for laundromat:",
            laundromatId
        );

        const response = await fetch(

            `${API_URL}/services/laundromat/${laundromatId}`

        );

        const data = await response.json();

        console.log(
            "Services from database:",
            data
        );

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to load services"
            );

        }

        services =
            data.services || [];

        displayServices();

    }

    catch (error) {

        console.error(
            "Services Error:",
            error
        );

        document.getElementById(
            "servicesTable"
        ).innerHTML = `

            <tr>

                <td colspan="5"
                    style="text-align:center;">

                    Unable to load services.

                </td>

            </tr>

        `;

    }

}


// ==========================================
// DISPLAY SERVICES
// ==========================================

function displayServices() {

    const table =
        document.getElementById(
            "servicesTable"
        );

    table.innerHTML = "";


    if (services.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="5"
                    style="text-align:center;">

                    No services added yet.

                </td>

            </tr>

        `;

        return;

    }


    services.forEach(service => {

        table.innerHTML += `

            <tr>

                <td>
                    ${service.name}
                </td>

                <td>
                    R${Number(service.price).toFixed(2)}
                </td>

                <td>
                    ${service.duration || "N/A"}
                </td>

                <td>

                    <span class="${
                        service.status === "Active"
                        ? "available"
                        : "unavailable"
                    }">

                        ${service.status}

                    </span>

                </td>

                <td>

                    <button
                        class="edit"
                        onclick="editService(${service.id})">

                        Edit

                    </button>

                    <button
                        class="delete"
                        onclick="deleteService(${service.id})">

                        Delete

                    </button>

                </td>

            </tr>

        `;

    });

}


// ==========================================
// EDIT SERVICE
// ==========================================

function editService(id) {

    const service =
        services.find(
            s => Number(s.id) === Number(id)
        );

    if (!service) {

        alert(
            "Service not found."
        );

        return;

    }


    document.getElementById(
        "serviceName"
    ).value =
        service.name || "";


    document.getElementById(
        "servicePrice"
    ).value =
        service.price || "";


    document.getElementById(
        "serviceDuration"
    ).value =
        service.duration || "";


    document.getElementById(
        "serviceStatus"
    ).value =
        service.status || "Active";


    document.getElementById(
        "serviceDescription"
    ).value =
        service.description || "";


    document.getElementById(
        "serviceIndex"
    ).value =
        service.id;

}


// ==========================================
// ADD / UPDATE SERVICE
// ==========================================

document
.getElementById("serviceForm")
.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        if (!laundromatId) {

            alert(
                "Laundromat information is not available."
            );

            return;

        }


        const id =
            document.getElementById(
                "serviceIndex"
            ).value;


        const name =
            document.getElementById(
                "serviceName"
            ).value.trim();


        const price =
            Number(
                document.getElementById(
                    "servicePrice"
                ).value
            );


        const duration =
            document.getElementById(
                "serviceDuration"
            ).value.trim();


        const status =
            document.getElementById(
                "serviceStatus"
            ).value;


        const description =
            document.getElementById(
                "serviceDescription"
            ).value.trim();


        // ==================================
        // VALIDATION
        // ==================================

        if (!name) {

            alert(
                "Please enter a service name."
            );

            return;

        }


        if (!price || price <= 0) {

            alert(
                "Please enter a valid service price."
            );

            return;

        }


        // ==================================
        // UPDATE EXISTING SERVICE
        // ==================================

        if (id) {

            try {

                const response =
                    await fetch(

                        `${API_URL}/services/${id}`,

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    name:
                                        name,

                                    description:
                                        description,

                                    price:
                                        price,

                                    duration:
                                        duration,

                                    status:
                                        status

                                })

                        }

                    );


                const data =
                    await response.json();


                console.log(
                    "Update service response:",
                    data
                );


                if (!response.ok ||
                    !data.success) {

                    alert(
                        data.message ||
                        "Unable to update service."
                    );

                    return;

                }


                alert(
                    "Service updated successfully."
                );


            }

            catch(error) {

                console.error(
                    "Update error:",
                    error
                );

                alert(
                    "Unable to connect to server."
                );

                return;

            }

        }


        // ==================================
        // CREATE NEW SERVICE
        // ==================================

        else {

            try {

                const serviceData = {

                    laundromat_id:
                        laundromatId,

                    name:
                        name,

                    description:
                        description,

                    price:
                        price,

                    duration:
                        duration,

                    status:
                        status

                };


                console.log(
                    "Sending service to database:",
                    serviceData
                );


                const response =
                    await fetch(

                        `${API_URL}/services`,

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    serviceData
                                )

                        }

                    );


                const data =
                    await response.json();


                console.log(
                    "Create service response:",
                    data
                );


                if (!response.ok ||
                    !data.success) {

                    alert(
                        data.message ||
                        "Unable to create service."
                    );

                    return;

                }


                alert(
                    "Service added successfully."
                );

            }

            catch(error) {

                console.error(
                    "Create service error:",
                    error
                );

                alert(
                    "Unable to connect to server."
                );

                return;

            }

        }


        // ==================================
        // RESET FORM
        // ==================================

        this.reset();


        document.getElementById(
            "serviceIndex"
        ).value = "";


        // ==================================
        // LOAD FROM DATABASE AGAIN
        // ==================================

        await loadServices();

    }

);


// ==========================================
// DELETE SERVICE
// ==========================================

async function deleteService(id) {

    if (!confirm(
        "Delete this service?"
    )) {

        return;

    }


    try {

        const response =
            await fetch(

                `${API_URL}/services/${id}`,

                {

                    method: "DELETE"

                }

            );


        const data =
            await response.json();


        console.log(
            "Delete response:",
            data
        );


        if (!response.ok ||
            !data.success) {

            alert(
                data.message ||
                "Unable to delete service."
            );

            return;

        }


        alert(
            "Service deleted successfully."
        );


        await loadServices();

    }

    catch(error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Unable to connect to server."
        );

    }

}


// ==========================================
// LOGOUT
// ==========================================

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    function(e) {

        e.preventDefault();


        localStorage.removeItem(
            "loggedInUser"
        );


        window.location.href =
            "../login.html";

    }
);

</script>
</body>
</html>
