<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Laundromats | Campus Laundry Connect</title>

    <link rel="stylesheet" href="luandromats.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2> LaundryConnect</h2>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-store"></i>
                    Laundromats
                </a>
            </li>

            <li>
                <a href="book-laundry.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Book Laundry
                </a>
            </li>

            <li>
                <a href="my-orders.html">
                    <i class="fa-solid fa-box"></i>
                    My Orders
                </a>
            </li>

            <li>
                <a href="track-order.html">
                    <i class="fa-solid fa-location-dot"></i>
                    Track Order
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header>

            <div>

                <h1>Available Laundromats</h1>

                <p>Choose a registered laundromat.</p>

            </div>

        </header>

        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search laundromat...">

            <button>

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

        <!-- Dynamic Cards -->

        <div
            class="laundry-grid"
            id="laundromatContainer">

        </div>

    </main>

</div>

<script>

const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user || user.role !== "student") {

    alert("Please login first.");

    window.location.href = "../login.html";

}


// Logout
document.getElementById("logoutBtn").addEventListener("click", function (e) {

    e.preventDefault();

    localStorage.removeItem("loggedInUser");

    window.location.href = "../login.html";

});


const container = document.getElementById("laundromatContainer");

let laundromats = [];


// Load laundromats from backend
async function loadLaundromats() {

    try {

        const response = await fetch("https://laundry-ktbs.onrender.com/laundromats");

        const data = await response.json();

        if (!data.success) {

            container.innerHTML = `
                <h2 style="text-align:center;">
                    No laundromats available.
                </h2>
            `;

            return;

        }

        laundromats = data.laundromats;

        displayLaundromats(laundromats);

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `
            <h2 style="text-align:center;">
                Unable to load laundromats.
            </h2>
        `;

    }

}


// Display laundromats
function displayLaundromats(list) {

    container.innerHTML = "";

    if (list.length === 0) {

        container.innerHTML = `
            <h2 style="text-align:center;">
                No laundromats found.
            </h2>
        `;

        return;

    }

    list.forEach(function (laundromat) {

        container.innerHTML += `

        <div class="card">

        <img
            src="${
                laundromat.logo
                ? `https://laundry-ktbs.onrender.com/uploads/laundromats/${laundromat.logo}`
                : "../images/laundry.png"
            }"
            alt="Laundry">

            <div class="content">

                <h2>${laundromat.business_name}</h2>

                <p>

                    <i class="fa-solid fa-location-dot"></i>

                    ${laundromat.address || "Campus Area"}

                </p>

                <p>

                    <i class="fa-solid fa-clock"></i>

                    ${laundromat.opening_hours || "08:00 - 17:00"}

                </p>

                <p>

                    <i class="fa-solid fa-phone"></i>

                    ${laundromat.phone}

                </p>

                <p class="price">

                    From R${laundromat.price_per_load || 45} per load

                </p>

                <div class="buttons">

                    <button onclick="viewDetails(${laundromat.id})">

                        View Details

                    </button>

                    <button class="book"
                            onclick="bookLaundry(${laundromat.id})">

                        Book Now

                    </button>

                </div>

            </div>

        </div>

        `;

    });

}


// Search
document.getElementById("searchInput").addEventListener("keyup", function () {

    const keyword = this.value.toLowerCase();

    const filtered = laundromats.filter(function (laundromat) {

        return laundromat.business_name
            .toLowerCase()
            .includes(keyword);

    });

    displayLaundromats(filtered);

});


// View details
function viewDetails(id) {

    localStorage.setItem("selectedLaundromat", id);

    window.location.href = "laundromat-details.html";

}


// Book
function bookLaundry(id) {

    localStorage.setItem("selectedLaundromat", id);

    window.location.href = "book-laundry.html";

}


// Load page
loadLaundromats();
</script>

</body>
</html>
